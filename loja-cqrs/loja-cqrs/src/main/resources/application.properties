spring.application.name=loja-cqrs
server.port=8080

# Atraso (em milissegundos) antes de a projeção atualizar o banco de leitura.
# Serve só para a consistência eventual ficar visível na demonstração. Pode colocar 0.
loja.sincronizacao.atraso-ms=400

# Console enxuto: horário, nome da thread e a mensagem.
# O nome da thread mostra quem está trabalhando: "http-nio-..." é a requisição, "sincronizacao-1" é a projeção em segundo plano.
logging.pattern.console=%d{HH:mm:ss.SSS} [%-20.20t] %msg%n
logging.level.org.springframework=WARN
logging.level.org.apache=WARN
logging.level.com.loja=INFO